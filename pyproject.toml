[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codemix-nlu"
description = "Romanized, code-mixed Hinglish intent and slot NLU on MASSIVE: how much accuracy code-mixing costs versus Devanagari, measured, and what recovers it."
license = { text = "Apache-2.0" }
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["scikit-learn", "indic_transliteration"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "matplotlib"]
baselines = ["lightgbm", "sklearn-crfsuite"]
train = ["torch", "transformers", "seqeval", "optuna"]
serve = ["onnx", "onnxruntime", "transformers", "huggingface_hub"]

[tool.setuptools]
packages = ["cmx"]
