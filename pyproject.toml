[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codemix-nlu"
description = "Romanized, code-mixed Hinglish intent and slot NLU on MASSIVE: how much accuracy code-mixing costs versus Devanagari, measured, and what recovers it."
license = { text = "Apache-2.0" }
version = "1.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["scikit-learn", "indic_transliteration"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "matplotlib"]
baselines = ["lightgbm", "sklearn-crfsuite"]
train = ["torch", "transformers", "seqeval", "optuna"]
serve = ["onnx", "onnxscript", "onnxruntime", "tokenizers", "transformers", "huggingface_hub"]
model = ["onnxruntime", "tokenizers"]  # just enough to run the published int8 model

[project.scripts]
codemix-nlu = "cmx.__main__:main"  # `codemix-nlu benchmark predictions.jsonl` = `python -m cmx benchmark ...`

[project.urls]
Homepage = "https://github.com/vaibhav-4-ai/codemix-nlu"
Models = "https://huggingface.co/vaibhav-4-ai/codemix-nlu"
Dataset = "https://huggingface.co/datasets/vaibhav-4-ai/hinglish-massive-paired"
Demo = "https://deferral-curve.onrender.com/codemix"

[tool.setuptools]
packages = ["cmx"]

[tool.setuptools.package-data]
cmx = ["wordlists.json"]  # the CMI word lists, so `code_mixing()` works right after pip install
