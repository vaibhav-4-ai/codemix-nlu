name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Quick version - first number
        run: python -m cmx quick
  train-check:
    # No GPU here: a tiny model runs the real training loop for 2 steps, to prove it works.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[train]"
      - run: python -m cmx train --recipe fixed --seed 13
