name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: pytest
      - name: Quick version - first number
        run: python -m cmx quick
      - name: Download the 6 training runs' predictions from Hugging Face
        run: |
          for run in plain_seed13 fixed_seed13 plain_seed42 fixed_seed42 plain_seed1337 fixed_seed1337; do
            mkdir -p "artifacts/hf_runs/$run"
            for name in test devanagari_50 hinglish_50; do
              curl -sSfL -o "artifacts/hf_runs/$run/predictions_$name.jsonl" \
                "https://huggingface.co/vaibhav-4-ai/codemix-nlu/resolve/main/runs/$run/predictions_$name.jsonl"
            done
            curl -sSfL -o "artifacts/hf_runs/$run/metrics.json" \
              "https://huggingface.co/vaibhav-4-ai/codemix-nlu/resolve/main/runs/$run/metrics.json"
          done
      - name: Final numbers - with 95% ranges
        run: python -m cmx evaluate
      - name: Calibration - is the confidence honest?
        run: python -m cmx calibrate
  train-check:
    # No GPU here: a tiny model runs the real training loop for 2 steps, to prove it works.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[train]"
      - run: python -m cmx train --recipe fixed --seed 13
