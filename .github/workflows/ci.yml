name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]" huggingface_hub
      - run: ruff check --output-format=github .
      - run: pytest
      - name: Quick version - first number
        run: python -m cmx quick
      - name: Download the finished Kaggle runs from Hugging Face
        run: python scripts/fetch_runs.py
      - name: Final numbers - with 95% ranges, CMI bands, ablations, errors
        run: python -m cmx evaluate
      - name: Calibration - is the confidence honest, per CMI band?
        run: python -m cmx calibrate
      - name: Put the charts on Hugging Face (only with the HF_TOKEN secret, only on main)
        if: github.ref == 'refs/heads/main' && env.HF_TOKEN != ''
        run: python scripts/publish_charts.py
  analysis:
    # Data analysis + the simple comparison models. CPU only, a few minutes.
    runs-on: ubuntu-24.04
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,baselines]" huggingface_hub
      - name: Data analysis + code-mixing features
        run: python -m cmx eda
      - name: Classical baselines + nested cross-validation
        run: python -m cmx baselines
      - name: Put the charts on Hugging Face (only with the HF_TOKEN secret, only on main)
        if: github.ref == 'refs/heads/main' && env.HF_TOKEN != ''
        run: python scripts/publish_charts.py
  train-check:
    # No GPU here: a tiny model runs the real training loop for 2 steps, to prove it works.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[train]"
      - run: python -m cmx train --recipe fixed --seed 13
